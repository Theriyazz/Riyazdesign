# Netlify build configuration.
#
# The Next.js runtime handles the App Router, the image optimizer and the
# per-route rendering modes, so `publish` points at `.next` rather than at a
# static export — this site is not `output: "export"` and has real SSG routes
# under /work/[slug].

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 needs Node 20+. Pinned rather than left to Netlify's default so a
  # change to their default cannot silently move the build out from under us.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache the fingerprinted build output. Everything under /_next/static is
# content-hashed, so it can never go stale behind this header.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The optimized image derivatives are content-stable too, but not hashed, so
# they get a shorter window with revalidation rather than `immutable`.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/riyaz/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/tools/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
