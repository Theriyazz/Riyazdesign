<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero film variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#08080a; --raised:#0e0e11; --border:#1c1c21; --fg:#f4f3f0; --muted:#a8a8a4; --accent:#aaff00; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:Geist,system-ui,sans-serif; overflow-x:hidden; }
  button { font:inherit; cursor:pointer; }
  .switch { position:fixed; z-index:50; left:50%; top:16px; transform:translateX(-50%); display:flex; gap:4px; padding:4px; border:1px solid #2a2a31; border-radius:999px; background:rgba(14,14,17,.9); max-width:calc(100vw - 32px); }
  .switch button { border:0; background:none; color:var(--muted); padding:9px 16px; border-radius:999px; font-weight:500; font-size:14px; white-space:nowrap; }
  .switch button[aria-pressed=true] { background:var(--fg); color:var(--bg); }
  .stage { position:relative; height:100svh; min-height:640px; overflow:hidden; }
  .shell { position:relative; height:100%; width:min(1400px,100%); margin:auto; padding:0 40px; }
  .box { position:relative; height:100%; }
  .copy { position:absolute; inset:0 auto 0 0; width:min(589px,46%); display:flex; flex-direction:column; justify-content:space-between; padding:128px 0 64px; }
  .copy .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .pill { display:inline-flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:99px; padding:8px 14px; font:500 12px "Geist Mono",monospace; color:var(--muted); margin-bottom:32px; align-self:flex-start; }
  .pill i { width:8px; height:8px; border-radius:8px; background:var(--accent); }
  h1 { font-size:clamp(46px,6.2vw,92px); font-weight:700; letter-spacing:-.08em; line-height:.98; }
  h1 em { display:block; font-family:"Instrument Serif",serif; color:var(--accent); font-weight:400; letter-spacing:-.02em; }
  h1 small { display:block; margin-top:14px; font-size:clamp(20px,2.1vw,30px); font-weight:400; letter-spacing:-.02em; color:var(--muted); line-height:1.25; }
  .cta { align-self:flex-start; background:var(--accent); color:var(--bg); padding:15px 24px; border-radius:99px; font-weight:500; text-decoration:none; }
  .anchor { position:absolute; right:0; bottom:64px; width:43.2%; aspect-ratio:16/9; }
  .film { position:absolute; right:0; bottom:0; width:100%; height:100%; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:var(--raised); }
  .media { position:absolute; inset:0; }
  video { display:block; width:100%; height:100%; object-fit:cover; }
  .play { position:absolute; right:16px; bottom:16px; z-index:10; width:44px; height:44px; border-radius:44px; border:1px solid #2a2a31; background:rgba(14,14,17,.86); color:var(--fg); display:grid; place-items:center; font-size:13px; }
  .bubble { position:absolute; bottom:calc(100% - 25px); right:3.8%; z-index:20; background:var(--accent); color:var(--bg); padding:18px 20px; border-radius:16px 16px 4px 16px; font-weight:500; font-size:clamp(15px,1.5vw,21px); letter-spacing:-.03em; line-height:1.25; }
  .bubble em { font-family:"Instrument Serif",serif; }
  .notes { width:min(1000px,100%); margin:auto; padding:96px 40px 140px; }
  .notes h2 { font-size:clamp(34px,4vw,56px); letter-spacing:-.04em; line-height:1.05; margin-bottom:18px; }
  .notes p { color:var(--muted); font-size:18px; line-height:1.55; max-width:62ch; margin-bottom:12px; }
  .notes a { color:var(--accent); }
  @media (max-width:1023px) {
    .stage { height:auto; min-height:100svh; }
    .shell { padding:96px 20px 40px; height:auto; }
    .box { height:auto; display:flex; flex-direction:column; gap:48px; }
    .copy { position:static; width:100%; padding:0; gap:32px; }
    .anchor { position:relative; right:auto; bottom:auto; width:100%; }
    .bubble { font-size:13px; padding:12px 14px; }
    .switch button { padding:8px 11px; font-size:13px; }
    .notes { padding:64px 20px 96px; }
  }
</style>
</head>
<body>
  <nav class="switch" aria-label="Film variation">
    <button data-film="m" aria-pressed="true">Music + SFX</button>
    <button data-film="s" aria-pressed="false">SFX only</button>
    <button id="sound" type="button">Sound off</button>
  </nav>

  <section class="stage" id="stage">
    <div class="shell"><div class="box" id="box">
      <div class="copy">
        <div class="mid">
          <div class="pill exit"><i></i>Open to product design roles</div>
          <h1 class="exit"><em>Hi,</em>I&rsquo;m Riyaz Malek<small>Product Designer based in Vadodara</small></h1>
        </div>
        <a class="cta exit" href="#notes">See the work</a>
      </div>
      <div class="anchor" id="anchor">
        <div class="film" id="film">
          <div class="media" id="media"><video id="video" muted loop playsinline preload="none"></video></div>
          <button class="play" id="play" type="button" aria-label="Play intro film">&#9654;</button>
        </div>
        <div class="bubble" id="bubble">Creating <em>Web Experiences</em><br />for humans since 2023.</div>
      </div>
    </div></div>
  </section>

  <section class="notes" id="notes">
    <h2 id="n-title"></h2>
    <p id="n-idea"></p>
    <p id="n-color"></p>
    <p><a id="n-full" href="#">Open the full film on its own</a></p>
  </section>

  <script src="gsap.min.js"></script>
  <script src="ScrollTrigger.min.js"></script>
  <script>
    const FILMS = {
      m: { file:"riyaz-intro-music-sfx", title:"Music + SFX", idea:"35.2 seconds at 1.25x, with an original instrumental track and every effect timed to the picture. The music pulls back under the testimonials.", color:"No vocals. Press Sound off to turn the sound on." },
      s: { file:"riyaz-intro-sfx", title:"SFX only", idea:"The same picture with effects alone: pops, clicks, camera flights, blades and impacts.", color:"No music and no vocals. Press Sound off to turn the sound on." },
    };
    history.scrollRestoration = "manual";
    gsap.registerPlugin(ScrollTrigger);
    const $ = (id) => document.getElementById(id);
    const video = $("video"), play = $("play");
    let intent = "auto", autoWanted = false;
    function sync() {
      const want = intent === "play" || (intent === "auto" && autoWanted);
      if (want && !document.hidden) video.play().catch(() => {});
      else if (!video.paused) video.pause();
    }
    video.onplay = () => { play.innerHTML = "&#10074;&#10074;"; play.setAttribute("aria-label","Pause intro film"); };
    video.onpause = () => { play.innerHTML = "&#9654;"; play.setAttribute("aria-label","Play intro film"); };
    play.onclick = () => { intent = video.paused ? "play" : "pause"; if (video.paused) video.preload = "auto"; sync(); };
    function choose(id) {
      const f = FILMS[id];
      document.querySelectorAll(".switch button[data-film]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.film === id));
      video.pause();
      video.poster = "web/riyaz-intro.jpg";
      video.src = "web/" + f.file + ".mp4";
      video.preload = "none";
      intent = "auto";
      $("n-title").textContent = f.title;
      $("n-idea").textContent = f.idea;
      $("n-color").textContent = f.color;
      $("n-full").href = "web/" + f.file + ".mp4";
      history.replaceState(null, "", "#" + id);
      video.load();
      sync();
    }
    document.querySelectorAll(".switch button[data-film]").forEach((b) => (b.onclick = () => choose(b.dataset.film)));
    $("sound").onclick = () => { video.muted = !video.muted; $("sound").textContent = video.muted ? "Sound off" : "Sound on"; };
    choose(FILMS[location.hash.slice(1)] ? location.hash.slice(1) : "m");

    // The same scene as components/sections/Hero.tsx, desktop branch.
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const stage = $("stage"), box = $("box"), anchor = $("anchor"), film = $("film"), media = $("media"), bubble = $("bubble");
    const update = (self) => {
      autoWanted = self.progress >= 0.985;
      if (self.progress > 0.12 && video.preload === "none") video.preload = "auto";
      sync();
    };
    if (!reduced && innerWidth >= 1024) {
      const landed = () => {
        const w = box.clientWidth, h = Math.min((w * 9) / 16, innerHeight - 160), width = (h * 16) / 9;
        return { width, height: h, right: (w - width) / 2, bottom: (stage.clientHeight - h) / 2 - 64 };
      };
      gsap.timeline({ defaults:{ ease:"none" }, scrollTrigger:{ trigger:stage, start:"top top", end:() => "+=" + Math.round(innerHeight * 1.25), pin:true, scrub:0.6, invalidateOnRefresh:true, onUpdate:update } })
        .to(".exit", { y:-110, opacity:0, ease:"power2.in", duration:0.34, stagger:0.035 }, 0)
        .to(bubble, { x:220, y:-36, rotate:6, opacity:0, ease:"power3.in", duration:0.26 }, 0)
        .fromTo(film, { width:() => anchor.offsetWidth, height:() => anchor.offsetHeight, right:0, bottom:0, borderRadius:14 },
          { width:() => landed().width, height:() => landed().height, right:() => landed().right, bottom:() => landed().bottom, borderRadius:28, ease:"power3.inOut", duration:0.8 }, 0.08)
        .fromTo(media, { scale:1.12 }, { scale:1, ease:"power2.out", duration:0.8 }, 0.08)
        .to({}, { duration:0.12 }, 0.88);
    } else if (!reduced) {
      // Phones keep the poster until the visitor has actually scrolled, as Hero.tsx does.
      const phone = () => { autoWanted = scrollY > 80 && film.getBoundingClientRect().top < innerHeight * 0.5; if (autoWanted) video.preload = "auto"; sync(); };
      ScrollTrigger.create({ start:0, end:"max", onUpdate:phone });
    }
  </script>
</body>
</html>
